[package]
name = "cslt"
version = "0.1.0"
edition = "2021"
authors = ["CRT-HAO"]
repository = "https://github.com/NTUST-Hack/cslt"


[dependencies]
anyhow = { version = "1", features = ["backtrace"] }
async-trait = "0.1"
cookie_store = "0.21"
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "cookies", "blocking"] }
reqwest_cookie_store = "0.8"
scraper = { version = "0.20", features = ["atomic"] }
serde = "1"
serde_derive = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
url = "2.5"
